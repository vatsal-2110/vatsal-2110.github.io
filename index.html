<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Vatsal</title>
  <style>
    :root {
      --text: #242424;
      --muted: #686868;
      --line: #e8e8e8;
      --link: #2858a6;
      --width: 860px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: #fff;
      font: 16px/1.65 Georgia, "Times New Roman", serif;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { width: min(var(--width), calc(100% - 40px)); margin: 0 auto; }
    header { border-bottom: 1px solid var(--line); }
    nav {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font: 14px/1.4 Arial, Helvetica, sans-serif;
    }
    .brand { font-weight: 700; font-size: 16px; color: var(--text); }
    .columns { display: flex; flex-wrap: wrap; gap: 22px; }
    .columns a { color: var(--muted); }
    .columns a:hover { color: var(--link); }
    main { min-height: 65vh; }
    h1 {
      margin: 60px 0 14px;
      font-size: clamp(34px, 6vw, 46px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.035em;
    }
    .intro { max-width: 650px; color: var(--muted); margin: 0; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 22px;
      font: 14px/1.5 Arial, Helvetica, sans-serif;
    }
    footer {
      margin-top: 70px;
      padding: 18px 0 26px;
      border-top: 1px solid var(--line);
      color: #888;
      font: 12px/1.6 Arial, Helvetica, sans-serif;
    }
    @media (max-width: 540px) {
      nav { align-items: flex-start; flex-direction: column; justify-content: center; padding: 14px 0; gap: 10px; }
      .columns { gap: 15px; }
      h1 { margin-top: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="container" aria-label="Main navigation">
      <a class="brand" href="#">Vatsal</a>
      <div class="columns">
        <a href="#about">About</a>
        <a href="#research">Research</a>
        <a href="#projects">Projects</a>
        <a href="#cv">CV</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <main class="container" id="about">
    <h1>Vatsal</h1>
    <p class="intro">Mathematics &amp; Computing student at IIT Roorkee. Interested in machine learning, computer vision, and artificial intelligence.</p>
    <div class="links" id="contact">
      <a href="mailto:YOUR_EMAIL@example.com">Email</a>
      <a href="https://github.com/vatsal-2110">GitHub</a>
      <a href="https://www.linkedin.com/">LinkedIn</a>
      <a id="cv" href="cv.pdf">CV</a>
    </div>
  </main>

  <footer class="container">© <span id="year"></span> Vatsal</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
