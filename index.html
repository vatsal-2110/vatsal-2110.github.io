<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Vatsal</title>
  <style>
    :root { --bg:#fff; --text:#242424; --muted:#686868; --line:#e7e7e7; --link:#285aa6; --hover:#f5f5f5; }
    [data-theme="dark"] { color-scheme:dark; --bg:#171717; --text:#eee; --muted:#b5b5b5; --line:#333; --link:#a8c5ff; --hover:#252525; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.7 Georgia,"Times New Roman",serif; }
    a { color:var(--link); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { width:min(900px, calc(100% - 44px)); margin:0 auto; }
    .topbar { border-bottom:1px solid var(--line); background:var(--bg); }
    nav { min-height:66px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .brand { color:var(--text); font:700 15px/1.4 Arial,Helvetica,sans-serif; white-space:nowrap; }
    .nav-right { display:flex; align-items:center; gap:20px; }
    .navlinks { display:flex; align-items:center; flex-wrap:wrap; gap:19px; }
    .navlinks a { color:var(--muted); font:13px/1.5 Arial,Helvetica,sans-serif; }
    .navlinks a:hover { color:var(--text); text-decoration:none; }
    .theme { border:1px solid var(--line); color:var(--muted); background:transparent; border-radius:50%; width:29px; height:29px; cursor:pointer; font-size:15px; }
    .menu { display:none; border:1px solid var(--line); border-radius:4px; color:var(--text); background:transparent; padding:6px 9px; }
    main { min-height:65vh; }
    .intro { padding:69px 0 0; }
    h1 { margin:0 0 17px; font-size:clamp(34px,5vw,43px); line-height:1.2; font-weight:500; letter-spacing:-.035em; }
    p { max-width:760px; margin:0; color:var(--muted); font-size:17px; line-height:1.85; }
    .contact { display:flex; flex-wrap:wrap; gap:18px; margin-top:23px; font:13px/1.6 Arial,Helvetica,sans-serif; }
    footer { margin-top:82px; padding:17px 0 25px; border-top:1px solid var(--line); color:#888; font:12px/1.6 Arial,Helvetica,sans-serif; }
    @media(max-width:700px) {
      nav { min-height:60px; flex-wrap:wrap; padding:12px 0; }
      .nav-right { gap:10px; }
      .menu { display:block; }
      .navlinks { display:none; width:100%; padding:8px 0 4px; gap:11px 18px; }
      .navlinks.open { display:flex; }
      .intro { padding-top:46px; }
      p { font-size:16px; }
    }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="wrap" aria-label="Main navigation">
      <a class="brand" href="./index.html">Vatsal</a>
      <div class="nav-right">
        <div class="navlinks" id="navlinks">
          <a href="#about">About</a>
          <a href="./research.html">Research</a>
          <a href="./resume.html">CV</a>
          <a href="./blog.html">Writing</a>
          <a href="./reading.html">Reading</a>
          <a href="./news.html">News</a>
          <a href="./experience.html">Experience</a>
          <a href="./travel.html">Travel</a>
        </div>
        <button class="theme" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
        <button class="menu" id="menu" aria-expanded="false" aria-controls="navlinks">Menu</button>
      </div>
    </nav>
  </header>
  <main class="wrap" id="about">
    <section class="intro">
      <h1>Vatsal</h1>
      <p>I am a student in Mathematics &amp; Computing at IIT Roorkee. My interests include machine learning, computer vision, generative AI, and AI security.</p>
      <div class="contact">
        <a href="mailto:YOUR_EMAIL@example.com">Email</a>
        <a href="https://github.com/vatsal-2110" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/">LinkedIn</a>
      </div>
    </section>
    <footer>© <span id="year"></span> Vatsal</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const root = document.documentElement;
    document.getElementById("theme").addEventListener("click", () => {
      const dark = root.getAttribute("data-theme") !== "dark";
      if (dark) root.setAttribute("data-theme", "dark"); else root.removeAttribute("data-theme");
    });
    const menu = document.getElementById("menu");
    const links = document.getElementById("navlinks");
    menu.addEventListener("click", () => {
      const open = links.classList.toggle("open");
      menu.setAttribute("aria-expanded", String(open));
    });
  </script>
</body>
</html>
